site_name: APEX — Automated Photometry EXtraction
site_description: Desktop + headless pipeline for astronomical aperture/PSF photometry, CMD/isochrone fitting, and multi-night light-curve & period analysis.
repo_url: https://github.com/Diu1773/APEX_AutomatedPhotometryEXtraction
repo_name: APEX

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Command-line interface: cli.md
  - Configuration: configuration.md
  - Design & internals:
      - PSF photometry: psf-photometry-analysis.md
      - Cache manager: cache-manager-design.md
      - Cache inventory: cache-inventory.md
      - Parameter inventory: parameter-inventory.md

# Build the site with:  pip install -e ".[docs]"  &&  mkdocs serve
