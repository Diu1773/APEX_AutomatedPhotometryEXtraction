# Step 2 image crop (headless / config-driven).
# The GUI gets the crop rectangle from a mouse selection; for headless runs it
# is read from here. When enable = false (default) the crop step is skipped and
# the original frames are used. To crop, set enable = true and the pixel
# rectangle (x0,y0) -> (x1,y1) (0-based; y0:y1, x0:x1 slice). An existing
# step2_crop/crop_rect.json (written by the GUI) takes precedence over this.
[crop]
enable = false
# x0 = 100
# y0 = 150
# x1 = 900
# y1 = 850

[parallel]
