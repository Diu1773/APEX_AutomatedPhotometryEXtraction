# Cross-platform desktop bundles (macOS + Linux). The existing Windows installer
# pipeline lives in windows-build.yml. This workflow is UNVALIDATED until first
# run on CI (the maintainer develops on Windows only) — treat the produced
# artifacts as beta until smoke-tested on real hardware.
#
# Code signing is intentionally NOT enabled: it requires secrets only the
# maintainer can provide (see the commented steps). Unsigned bundles will warn
# on first launch (macOS Gatekeeper / SmartScreen).
name: Build (macOS + Linux)

on:
  # Manual-only. APEX ships Windows-only, and the frozen-bundle smoke imports
  # astroquery, which pulls astropy data that fails on hosted Linux/macOS
  # runners (the astropy_icon.png endpoint is permanently 404). Run on demand
  # from the Actions tab when you actually want a Linux/macOS bundle.
  workflow_dispatch:

jobs:
  build:
    name: Bundle ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      - name: Install (gui + build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,build]"

      - name: Pre-build smoke (headless import)
        run: python main.py --smoke

      - name: Build onedir bundle (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --windowed --name APEX \
            --collect-all astropy \
            --collect-data astropy.samp \
            --collect-all photutils \
            --collect-all astroquery \
            --collect-all pyvo \
            --collect-submodules scipy \
            --add-data "apex/resources:apex/resources" \
            --add-data "parameters.example.toml:." \
            main.py

      - name: Smoke-test frozen bundle (macOS)
        if: runner.os == 'macOS'
        run: ./dist/APEX.app/Contents/MacOS/APEX --smoke

      - name: Smoke-test frozen bundle (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/APEX/APEX --smoke

      # ── Code signing (SECRET-GATED — maintainer must supply secrets) ──────────
      # macOS: needs APPLE_DEVELOPER_ID cert + notarization (APPLE_ID,
      #   APPLE_APP_PASSWORD, APPLE_TEAM_ID). Steps would `codesign --deep` the
      #   .app and `xcrun notarytool submit` the zipped bundle, then `staple`.
      # Without these, the .app is unsigned and Gatekeeper will warn.
      #
      # - name: Sign & notarize (macOS)
      #   if: runner.os == 'macOS' && secrets.APPLE_DEVELOPER_ID != ''
      #   run: ...

      - name: Package artifact
        run: |
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -ry "APEX-macOS.zip" "APEX.app"
          else
            tar czf "APEX-Linux-x64.tar.gz" "APEX"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-${{ runner.os }}
          path: dist/APEX-*
