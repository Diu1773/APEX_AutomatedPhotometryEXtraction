name: Tests

on:
  push:
    branches: [main, "codex/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (no GUI)
        run: |
          pip install --upgrade pip
          pip install \
            numpy scipy pandas matplotlib astropy \
            photutils astroquery \
            pydantic pytest

      - name: Syntax check
        run: python -m compileall apex main.py -q

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
