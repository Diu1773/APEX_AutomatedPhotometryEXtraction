name: Windows Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build release
        shell: cmd
        run: deploy\build_release.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Windows
          path: release/Setup/*
