name: Windows Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to publish a GitHub Release on tag push

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build release
        shell: cmd
        run: deploy\build_release.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Windows
          path: release/Setup/*

      # On a version tag (e.g. v0.1.0) push, publish a public Release with the
      # installer + portable zip attached. `git tag v0.1.0 && git push --tags`.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Setup/*
          draft: false
          prerelease: false
          body: |
            ## APEX — Windows 다운로드

            아래 **Assets** 에서 받으세요:

            - `setup-APEX-*.exe` — 설치형 (관리자 권한 불필요)
            - `APEX-Portable-*-x64.zip` — 무설치 포터블 (압축 풀고 `APEX.exe` 실행)

            📖 **사용 매뉴얼:** https://diu1773.github.io/APEX_AutomatedPhotometryEXtraction/manual/

            > 외부 WCS 솔버(ASTAP / astrometry.net)와 카탈로그 데이터는 포함되지
            > 않습니다(없어도 내장 Python 솔버로 동작합니다).
