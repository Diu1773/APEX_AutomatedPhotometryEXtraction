<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#131b35"/>
      <stop offset="100%" stop-color="#07090f"/>
    </radialGradient>
    <linearGradient id="mtnGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#1a2f6a" stop-opacity="0.7"/>
      <stop offset="40%"  stop-color="#2979d4"/>
      <stop offset="75%"  stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#e8f5ff"/>
    </linearGradient>
    <linearGradient id="mtnRight" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#0d1c4a" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#1a5ca8"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#80d8ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d47a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4dd0e1" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#7c4dff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4dd0e1" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="starFilter" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="edgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <circle cx="128" cy="128" r="122"/>
    </clipPath>
  </defs>

  <circle cx="128" cy="128" r="128" fill="#07090f"/>
  <circle cx="128" cy="128" r="126" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="122" fill="none"
          stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.55"/>

  <g clip-path="url(#clip)">
    <ellipse cx="128" cy="178" rx="80" ry="16"
             fill="#1a3a8a" opacity="0.18" filter="url(#edgeGlow)"/>
    <polygon points="128,52  55,182  128,182" fill="url(#mtnGrad)" opacity="0.82"/>
    <polygon points="128,52  128,182  201,182" fill="url(#mtnRight)" opacity="0.72"/>
    <polyline points="55,182 128,52 201,182" fill="none"
              stroke="url(#mtnGrad)" stroke-width="2"
              filter="url(#edgeGlow)" opacity="0.9"/>
    <line x1="83" y1="148" x2="173" y2="148"
          stroke="#4dd0e1" stroke-width="1.2" opacity="0.35"/>
    <polygon points="128,52  110,95  146,95" fill="#e8f5ff" opacity="0.18"/>
    <circle cx="128" cy="52" r="26" fill="url(#starGlow)" opacity="0.85"/>
    <g filter="url(#starFilter)">
      <line x1="128" y1="32" x2="128" y2="72"
            stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
      <line x1="108" y1="52" x2="148" y2="52"
            stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      <line x1="115" y1="39" x2="141" y2="65"
            stroke="#b3e5fc" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
      <line x1="141" y1="39" x2="115" y2="65"
            stroke="#b3e5fc" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
      <circle cx="128" cy="52" r="4" fill="#ffffff"/>
      <circle cx="128" cy="52" r="7" fill="#80d8ff" opacity="0.5"/>
    </g>
  </g>

  <!-- APEX text — moved up to fit within circle -->
  <text x="128" y="210"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="200" letter-spacing="10"
        fill="#d6eeff" text-anchor="middle" opacity="0.92">APEX</text>

  <!-- Subtitle — smaller font, tighter spacing to stay inside circle -->
  <text x="128" y="226"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="7" font-weight="300" letter-spacing="1.8"
        fill="#4dd0e1" text-anchor="middle" opacity="0.6">AUTOMATED PHOTOMETRY</text>
</svg>
