[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-photometry"
dynamic = ["version"]
description = "APEX — Automated Photometry EXtraction: a desktop + scriptable pipeline for astronomical aperture/PSF photometry, CMD/isochrone fitting, and multi-night light-curve/period analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "APEX Project" }]
keywords = [
    "astronomy", "photometry", "aperture-photometry", "psf-photometry",
    "light-curve", "color-magnitude-diagram", "isochrone", "exoplanet", "fits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

# Core = the HEADLESS scientific + CLI runtime. Deliberately excludes PyQt5 so
# `pip install apex-photometry` works on servers/CI without a display. Desktop
# users install `apex-photometry[gui]`. requirements.txt remains the pinned set
# the Windows PyInstaller build consumes; this table is the source of truth for
# pip/conda installs and should be kept consistent with it.
dependencies = [
    "numpy>=1.24,<3",
    "bottleneck>=1.3.8,<2",
    "sep>=1.4,<2",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "astropy>=5.3,<8",
    "photutils>=1.9,<3",
    "astroscrappy>=1.1,<2",
    "astroquery>=0.4.7,<0.5",
    "pydantic>=2.5,<3",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0,<2",
    "requests>=2.31,<3",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
# Desktop GUI + the science tools its menus expose.
gui = [
    "PyQt5>=5.15.10,<5.16",
    "PyQt5-sip>=12.13",
    "sip>=6.7,<7",
    "PyOpenGL>=3.1.7",
    "PyOpenGL-accelerate>=3.1.7",
    "batman-package>=2.4",
    "emcee>=3.1",
]
build = ["pyinstaller>=6.5,<7"]
test = ["pytest>=8,<9", "emcee>=3.1"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
# Cross-check benchmarks against independent reductions (validation figures only).
validation = ["ccdproc>=2.4,<3"]
# Everything a contributor needs in one shot.
dev = [
    "PyQt5>=5.15.10,<5.16",
    "PyQt5-sip>=12.13",
    "sip>=6.7,<7",
    "PyOpenGL>=3.1.7",
    "PyOpenGL-accelerate>=3.1.7",
    "batman-package>=2.4",
    "emcee>=3.1",
    "pyinstaller>=6.5,<7",
    "pytest>=8,<9",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "ccdproc>=2.4,<3",
]
# Full runtime (headless core + GUI) without dev/build tooling.
all = [
    "PyQt5>=5.15.10,<5.16",
    "PyQt5-sip>=12.13",
    "sip>=6.7,<7",
    "PyOpenGL>=3.1.7",
    "PyOpenGL-accelerate>=3.1.7",
    "batman-package>=2.4",
    "emcee>=3.1",
]

[project.scripts]
# Headless command-line front end (diagnostics, config, version). The GUI
# launcher remains `apex-gui`.
apex = "apex.cli:main"
apex-gui = "apex.gui_entry:main"

[project.urls]
Homepage = "https://github.com/Diu1773/APEX_AutomatedPhotometryEXtraction"
Repository = "https://github.com/Diu1773/APEX_AutomatedPhotometryEXtraction"

[tool.setuptools]
# The repository is "src-less": packages live at the top level.
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "apex.__version__" }

[tool.setuptools.packages.find]
include = ["apex*"]
exclude = ["tests*", "benchmark*", "validation*", "deploy*", "scripts*", "tools*"]

[tool.setuptools.package-data]
apex = ["resources/*.svg", "resources/*.ico", "resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running validation tests against site-local real data (deselect with '-m \"not slow\"')",
]
