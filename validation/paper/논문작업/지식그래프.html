<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>지식그래프 — APEX 논문·재현·검증</title>
<style>
:root{--bg:#14181f;--panel:#1c2129;--ink:#d8dee9;--mut:#7b8494;--line:#2a313c;
 --c0:#e5e9f0;--c1:#5e94c4;--c2:#63a877;--c3:#8f84c9;--c4:#c99a56;--c5:#bb6f6f;--c6:#5aa6a0;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.55 "Pretendard Variable",system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
#wrap{display:flex;height:100vh}
#gv{flex:1;position:relative;min-width:0}
canvas{display:block;cursor:grab}
canvas.drag{cursor:grabbing}
#top{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center;z-index:5}
#q{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;
 padding:6px 10px;width:220px;outline:none;font:inherit}
#q:focus{border-color:#4a5568}
#title{position:absolute;bottom:12px;left:12px;color:var(--mut);font-size:12px;z-index:5}
#legend{position:absolute;top:12px;right:12px;background:rgba(28,33,41,.92);border:1px solid var(--line);
 border-radius:6px;padding:10px 12px;font-size:12px;z-index:5}
#legend div{display:flex;align-items:center;gap:7px;margin:3px 0;cursor:pointer;user-select:none}
#legend div.off{opacity:.35}
#legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
#side{width:0;transition:width .15s;background:var(--panel);border-left:1px solid var(--line);
 overflow:hidden;flex-shrink:0}
#side.open{width:460px}
#sinner{width:460px;height:100%;overflow-y:auto;padding:18px 22px}
#sclose{float:right;background:none;border:1px solid var(--line);color:var(--mut);border-radius:4px;
 cursor:pointer;padding:2px 9px;font:inherit}
#sclose:hover{color:var(--ink)}
#sbody h1{font-size:17px;margin:.4em 0}
#sbody h2{font-size:14px;margin:1.2em 0 .4em;color:#a8b2c4;border-bottom:1px solid var(--line);padding-bottom:3px}
#sbody a{color:#7ba7d0;text-decoration:none}
#sbody a:hover{text-decoration:underline}
#sbody ul{padding-left:18px;margin:.3em 0}
#sbody li{margin:.15em 0}
#sbody code{background:#252c37;border-radius:3px;padding:1px 5px;font-size:12px}
#sbody .ilink{color:#9ec49a;cursor:pointer}
#sbody .ilink:hover{text-decoration:underline}
</style></head><body>
<div id="wrap">
 <div id="gv">
  <div id="top"><input id="q" placeholder="검색 (제목·저자·키)" autocomplete="off"></div>
  <div id="legend"></div>
  <div id="title">APEX 논문 지식그래프 · 노드 클릭=카드 · 드래그·휠줌 · 범례 클릭=분류 토글</div>
  <canvas id="cv"></canvas>
 </div>
 <div id="side"><div id="sinner"><button id="sclose">닫기 ✕</button><div id="sbody"></div></div></div>
</div>
<script>
const G = {"cats": {"1": "재현 그림", "2": "레퍼런스 논문", "3": "데이터 자산", "4": "확정 결정·원칙", "5": "조사·진단", "6": "보류·미결"}, "nodes": [{"id": "hub_paper", "label": "RASTI/PASP 논문", "title": "RASTI/PASP 논문", "type": "hub", "cat": 0, "card": "# APEX 도구 논문\nRASTI/PASP급. 원고 `validation/paper/MANUSCRIPT_ko.md`(+영문). 구조 v4 = `OUTLINE.md`.\n- 그림 헌장: [[dec_figure_spec|FIGURE_SPEC]] · 재현 현황: `REPRODUCTION_STATUS.md`\n- 리뷰 R1: Major Revision(`REVIEW_ROUND1.md`) · 서지 40소스: `LIT_REVIEW.md`+`LIT_REVIEW_R2.md`\n- 원칙: [[dec_repro_def|재현=방법/법칙]] · [[dec_vv_ladder|verification→validation 사다리]]"}, {"id": "hub_repro", "label": "레퍼런스 재현 (/goal)", "title": "레퍼런스 재현 (/goal)", "type": "hub", "cat": 0, "card": "# 레퍼런스 검증-프레임 재현\n사용자 /goal: \"각 주요 논문 검증프레임을 할 수 있는 만큼 재현\". 정본 = `REPRODUCTION_STATUS.md`.\n- 완료 4: [[fig_completeness|완전도]] [[fig_astrometry|측성]] [[fig_iraf|IRAF교차]] [[fig_precision|정밀도floor]]\n- 보류: [[pend_lc_period|LC주기]] [[pend_zp_resid|광도보정잔차]] [[pend_cog|CoG]] [[pend_bouguer|소광]]"}, {"id": "fig_completeness", "label": "F5 완전도(실측주입)", "title": "F5 완전도(실측주입)", "type": "n", "cat": 1, "card": "# F5 — 검출 완전도, 실측-프레임 주입\n`fig_completeness_realvssynth.py` → `figures/fig_completeness_realvssynth.png`\n- 재현: [[ref_haynes|Haynes 2002]] · [[ref_balrog|DES Balrog]] · [[ref_daophot|DAOPHOT ADDSTAR]] · [[ref_autophot|AutoPhOT App.D]]\n- 실측 3+4프레임: M67 i **m50 17.65** / NGC6811 R **15.64** / M13 V **14.90** (+법칙검증용 4프레임 추가)\n- (b) S/N 붕괴 패널: 7프레임 전부 peak-S/N축에서 단일 erf로 붕괴, **S/N50=4.05±0.18** (3.2σ 매치드필터와 일치) — [[dec_m13_ok|M13 이상치 아님]]\n- 하단: 실주입별 컷아웃 사다리 m13→16 (`make_injection_cutouts.npz`, inject_flux_catalog 정규경로)\n- 합성은 verification rung: S/N 기준 약간 보수적([[dec_synth_ok|2차 정정]]) · 조사: [[inv_completeness|완전도 조사노트]]"}, {"id": "fig_astrometry", "label": "F6 측성(Gaia잔차)", "title": "F6 측성(Gaia잔차)", "type": "n", "cat": 1, "card": "# F6 — 측성 검증\n`fig_astrometry.py` · 재현: [[ref_ofek_masci|Ofek 2019 / Masci 2019(ZTF)]]\n- 실측 66프레임(M13 15·M67 30·NGC6811 21) `step5_wcs/frame_wcs_qc.csv`\n- Gaia DR3 잔차 RMS **중앙값 0.258″**, 66/66 solved, 피팅 없음(파이프라인이 실제 배포한 WCS)\n- (b)패널은 별수-안정성으로 대체됨 — 원문은 노출/시간축. 개선 여지(사용자 지적)"}, {"id": "fig_iraf", "label": "F10 독립엔진(IRAF)", "title": "F10 독립엔진(IRAF)", "type": "n", "cat": 1, "card": "# F10 — 독립엔진 교차검증\n`fig_iraf_crosscheck.py` · 재현: [[ref_schechter|Schechter 1993]] · AutoPhOT Fig14\n- NGC6811 V 전-APEX 리덕션, 고정좌표 499별: APEX vs IRAF phot(DAOPHOT)\n- **MAD 9.7 mmag · RMS 18.7 · r=0.99989**, binned median faint까지 평평(계통 없음)\n- 데이터: `benchmark/runs/ngc6811_iraf_allapex_v1/phot_fixed_coords/fixed_comparison.csv`\n- 기기의존도 최저(같은 프레임, 두 코드) — 재현 4종 중 가장 깨끗"}, {"id": "fig_precision", "label": "정밀도 floor(예비)", "title": "정밀도 floor(예비)", "type": "n", "cat": 1, "card": "# 정밀도 floor — RMS vs mag\n`fig_precision_floor.py` · 귀속: [[ref_honeycutt|Honeycutt 1992]] (앙상블 방법검증)\n- 실측 M67 r 10프레임 1073별, Honeycutt 앙상블 ZP: **floor g/r/i = 5.4/5.2/6.7 mmag**\n- 경험RMS = 보고 mag_err (photon영역 일치 = 에러모델 정직) + bright end 계통 floor 노출\n- ⚠️ **10에폭 = under-powered**: 단일밤·binning 불가. floor값 자체는 에폭수 무감(5ep 5.18±0.33)\n- 귀속 정정 완료([[pend_precision_fix|Honeycutt 단독+예비 라벨]]) — CC/Kovács는 LC 재현으로 이관"}, {"id": "ref_haynes", "label": "Haynes 2002", "title": "Haynes 2002", "type": "n", "cat": 2, "card": "# Haynes 2002 (MNRAS 334,262)\n합성 vs 실측 프레임 주입 **0.4–0.5 mag 계통 차** + 순환성 경고(\"merely confirm the starting hypothesis\").\n→ §3.6을 실측-프레임 주입으로 전환시킨 근거. APEX 합성은 S/N 기준 오히려 약간 보수적\n([[dec_synth_ok|2차 정정]] — m50 우연 일치 철회, FWHM 트렌드로 설명)."}, {"id": "ref_balrog", "label": "DES Balrog", "title": "DES Balrog", "type": "n", "cat": 2, "card": "# Suchyta+ (DES Balrog)\n\"real pixel-level CCD images\"에 소스 주입 — 실측 주입의 서베이 표준. 컷아웃 예시 그림 관행의 출처 중 하나.\nHSC SynPipe도 동일 계열."}, {"id": "ref_daophot", "label": "Stetson (DAOPHOT)", "title": "Stetson (DAOPHOT)", "type": "n", "cat": 2, "card": "# Stetson 1987 — DAOPHOT ADDSTAR\n인공별 실측 주입의 원조 루틴. crowded-field 측광 표준."}, {"id": "ref_autophot", "label": "AutoPhOT (A&A 667 A62)", "title": "AutoPhOT (A&A 667 A62)", "type": "n", "cat": 2, "card": "# Brennan & Fraser 2022 — AutoPhOT\nQC·벤치마크 준거 논문. App.D=주입-회수(S/N erf), Fig12=주입 컷아웃, Fig14=IRAF 대조.\n[[fig_completeness|F5]]·[[fig_iraf|F10]] 둘 다 이 논문 형식 재현."}, {"id": "ref_ofek_masci", "label": "Ofek 2019 · Masci 2019", "title": "Ofek 2019 · Masci 2019", "type": "n", "cat": 2, "card": "# Ofek 2019 (PASP 131) · Masci 2019 (ZTF)\n서베이 측성 검증 보고 형식: 프레임별 Gaia 잔차 RMS + solve 신뢰도. [[fig_astrometry|F6]]이 재현.\nPP(Mommert 2017) 0.3″을 참조선으로 병기."}, {"id": "ref_schechter", "label": "Schechter 1993", "title": "Schechter 1993", "type": "n", "cat": 2, "card": "# Schechter+ 1993 (PASP 105,1342) — DoPHOT\n신규코드 vs 기성코드(DAOPHOT), 같은 별·고정좌표, Δmag-vs-mag 평평성으로 계통 귀속.\n[[fig_iraf|F10]]이 재현."}, {"id": "ref_honeycutt", "label": "Honeycutt 1992", "title": "Honeycutt 1992", "type": "n", "cat": 2, "card": "# Honeycutt 1992 (PASP 104,435)\n비교성 지정 없는 **앙상블 차등측광**(모든 별+프레임ZP 동시해). RMS-vs-mag은 앙상블이\n광자한계에 도달함을 보이는 방법검증. [[fig_precision|floor 그림]]의 올바른 단독 귀속."}, {"id": "ref_cc_kovacs", "label": "CC 2006 · Kovács 2005", "title": "CC 2006 · Kovács 2005", "type": "n", "cat": 2, "card": "# Collier Cameron 2006 (WASP) · Kovács 2005 (TFA)\n**detrending 논문** — 의도는 SYSREM/TFA 전후 floor 하강 비교(수천 에폭, 트랜짓 감도).\n10에폭 단일밤으론 재현 불가 → [[pend_lc_period|LC 재현]]에서 SYSREM 전후로 제대로.\nfloor 그림에서 귀속 제거 완료([[pend_precision_fix|정정 기록]])."}, {"id": "ref_period", "label": "Stellingwerf · Graham", "title": "Stellingwerf · Graham", "type": "n", "cat": 2, "card": "# Stellingwerf 1978 (PDM) · Graham 2013 (주기복원 비교)\n주기 복원 검증 준거. AE UMa(P=0.086017d)·YZ Boo(P=0.104092d) 문헌 확정값 보유.\nLC 전처리 deferred라 보류: [[pend_lc_period|LC 주기복원]]."}, {"id": "data_reprocess", "label": "reprocess 3성단", "title": "reprocess 3성단", "type": "n", "cat": 3, "card": "# E:\\APEX_validation\\reprocess\\\n전-APEX 헤드리스 재처리(raw→science). step7 forced phot: M13 15fr(BVR) · M67 30fr(gri) ·\nNGC6811 21fr(BVR). M5는 step7 없음. WCS QC 66프레임 전부 solved.\n과학프레임 위치: `{target}/sci/pp_*.fit` (M13만 calibrated/ 사용례 있음)."}, {"id": "data_injections", "label": "실측주입 7런", "title": "실측주입 7런", "type": 칙 검증(완료)", "type": "n", "cat": 5, "card": "# 7프레임 검출법칙 검증 — 완료 (2026-07-24)\nm50 = C − 2.5logσ − 5logFWHM, **지수 이론고정·C만 fit: 잔차 RMS 103 mmag** (동적범위 3.4mag, N=7).\n- 추가 4런: M67r_mid·M67g_broad·NGC6811R_broad·M13R_sharp (off-diagonal로 σ·FWHM 항 분리)\n- **교훈**: FWHM은 frame_stats(밝은별)가 아니라 **각 런의 주입커널**(empirical_psf.fits 반높이면적)로\n  — soft 프레임에서 9.30 vs 7.23px 괴리가 0.4mag 이탈 일으켰음(추적해 해소)\n- 이 법칙이 [[dec_repro_def|기기무관 재현]]의 실체 — 절대 깊이가 아니라 법칙이 검증 대상"}, {"id": "pend_precision_fix", "label": "floor 귀속 정정(완료)", "title": "floor 귀속 정정(완료)", "type": "n", "cat": 5, "card": "# 정밀도 floor 귀속 정정 — 완료 (2026-07-24 \"알아서 하쇼\")\nCC/Kovács 귀속 제거(둘은 detrending 논문 — 수천 에폭 전후비교, 10에폭으론 재현 불가) →\n**Honeycutt 1992 단독** + \"single night · preliminary\" 라벨을 그림·docstring에 명기.\n확정판은 [[pend_lc_period|LC]]에서 SYSREM 전후 비교로."}, {"id": "pend_lc_period", "label": "LC 주기복원", "title": "LC 주기복원", "type": "n", "cat": 6, "card": "# LC 재현 (Stellingwerf/Graham + CC/Kovács 진짜 재현)\n선결: 사용자 observed_Analysis 수동삭제 → LC 전처리(100GB) → step1-11.\n목표: AE UMa·YZ Boo 주기 문헌 대조 + SYSREM 전후 RMS-vs-mag(수백 에폭)."}, {"id": "pend_zp_resid", "label": "광도보정 잔차", "title": "광도보정 잔차", "type": "n", "cat": 6, "card": "# ZP·색항·잔차 그림 (Padmanabhan/Schlafly식)\n데이터는 cmd_zeropoint/에 있으나 **Gaia-CMD 보정계=논란영역**(이소크론·B필터 이력).\n어느 레퍼런스로 보정할지 사용자 결정 필요. [[inv_bfilter|BP 금지 교훈]] 적용."}, {"id": "pend_cog", "label": "Curve-of-growth", "title": "Curve-of-growth", "type": "n", "cat": 6, "card": "# 구경보정 CoG (Stetson/Howell)\napcorr_summary는 프레임당 단일값뿐 — 다중구경 재실행 필요."}, {"id": "pend_bouguer", "label": "소광 Bouguer", "title": "소광 Bouguer", "type": "n", "cat": 6, "card": "# zp vs airmass (Hardie 1962)\nframe_zeropoint.csv에 airmass 있음. 단 ZP 레퍼런스 얽힘 + airmass span 미확인."}, {"id": "fig_qc_depth", "label": "QC깊이 그림(완성)", "title": "QC깊이 그림(완성)", "type": "n", "cat": 1, "card": "# fig_qc_depth — 예측 vs 실현 깊이 (C안 완성, 2026-07-24)\n`fig_qc_depth.py` → `figures/fig_qc_depth.png` · Kessler Fig7(분포)+우리 기여(예측) 2패널\n- (a) 유효 57 단일노출의 실현 m50 분포(타깃별 스택) — 에폭별 깊이 모니터링\n- (b) **predicted(노이즈+PSF만, 검출 전) vs realized(실별): RMS 78 mmag**, ±0.5 QC밴드,\n  주입보정 7프레임 검은테, 배제 9프레임([[done_lawtest|법칙]]의 순환가드) 회색 공백원\n- 예측기 = 머지된 `apex/analysis/detection_limit.py` (PEAK_SN50=4.05, step7 QC게이트와 동일경로)\n- 실현 = `extract_realized_depth.py`(Eddington-safe 중앙값등급, master-한계 순환가드)\n- 조사 이력: `FIG_A_PRESENTATION_SURVEY.md` (Kessler 형식귀속 한정 포함)"}, {"id": "plan_figrebuild", "label": "그림 재작업+원고동기화 계획", "title": "그림 재작업+원고동기화 계획", "type": "n", "cat": 6, "card": "# 그림 전수 재작업 — 회고+계획 (2026-07-28)\n정본 `FIGURE_REBUILD_PLAN.md`. 사용자: fig1 대상/개수, fig3 전면재설계(\"너무 대충\"), fig4·fig5 출처 미표기.\n- **반복 실패 R1~R6**: R1 데이터출처 미표기(3회+) · R2 데이터를 모델처럼 · R3 표본부족 · R4 주장과대\n  · R5 알려진결함 방치(fig3 trials=4가 메모리에 있었는데 논문에 실림) · R6 원고이중화\n- **근본원인**: 규칙이 FIGURE_SPEC 문서에만 있고 코드 강제 없음 → **provenance_block() + 감사스크립트**로 전환\n- **P0-0 최우선(신규 발견)**: 투고본 `.tex` 검증절 11개 vs 국문 `.md` 16개 — **전처리(Step0)·검출기특성화\n  ·ccdproc·교차기기보정(LCO)·측성·시계열 6개 절이 투고본에 통째로 없음.** \"raw→science 원툴\" 주장의\n  근거 절 전체 누락 = R6 최악 사례. 초록의 \"cross-instrument 미검증\"도 보정축에선 부정확.\n- **P0**: fig3 재설계(trials≥30·오차막대·이중축폐기) · fig5를 NGC457 278별→NGC6811 499별 교체 · fig2/4/6 명세\n- **P1 결정**: **fig1 LCO 두기기 확장은 안 함**(사용자 의문 타당) — 논지밖·범위선언충돌·LCO는 보정축이 제자리.\n  대신 같은 기기 내 프레임수↑ 또는 M5/M3 대상↑"}, {"id": "pend_manuscript", "label": "원고 §3.6 갱신", "title": "원고 §3.6 갱신", "type": "n", "cat": 6, "card": "# 원고 반영 대기\n§3.6을 다중프레임 실측주입+법칙으로 갱신 · §3.7(측성)·§3.15(시계열) 스텁 채우기 ·\n[[dec_citation_fixes|인용 6건]] 반영 · Data Availability 그림번호 깨짐 수정."}], "edges": [["hub_paper", "hub_repro"], ["hub_paper", "dec_figure_spec"], ["hub_paper", "dec_citation_fixes"], ["hub_paper", "dec_vv_ladder"], ["hub_paper", "pend_manuscript"], ["hub_paper", "plan_figrebuild"], ["plan_figrebuild", "dec_figure_spec"], ["hub_repro", "fig_completeness"], ["hub_repro", "fig_astrometry"], ["hub_repro", "fig_iraf"], ["hub_repro", "fig_precision"], ["hub_repro", "dec_repro_def"], ["fig_completeness", "ref_haynes"], ["fig_completeness", "ref_balrog"], ["fig_completeness", "ref_daophot"], ["fig_com const CATCOL = {0:'--c0',1:'--c1',2:'--c2',3:'--c3',4:'--c4',5:'--c5',6:'--c6'};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const gv = document.getElementById('gv');

// ── 데이터 준비 ──
const nodes = G.nodes.map(n => ({...n, x:0, y:0, vx:0, vy:0, deg:0}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = G.edges.map(([a,b]) => ({a:byId[a], b:byId[b]})).filter(e => e.a && e.b);
edges.forEach(e => {e.a.deg++; e.b.deg++;});
nodes.forEach((n,i) => {
  const ang = i/nodes.length*2*Math.PI, r = n.type==='hub'?120:320;
  n.x = Math.cos(ang)*r + (i%7-3)*17;  n.y = Math.sin(ang)*r + (i%5-2)*23;
  n.r = n.type==='hub' ? 13 : 6 + Math.min(4, n.deg*0.6);
});

// ── 물리 시뮬 ──
let alpha = 1, hidden = new Set();
const vis = n => !hidden.has(n.cat);
function tick(){
  if (alpha < 0.005) return;
  alpha *= 0.995;
  const vn = nodes.filter(vis);
  for (let i=0;i<vn.length;i++) for (let j=i+1;j<vn.length;j++){
    const a=vn[i], b=vn[j];
    let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy || 1, d=Math.sqrt(d2);
    const f = 2600/d2 * alpha;
    dx/=d; dy/=d;
    a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;
  }
  edges.forEach(e => {
    if(!vis(e.a)||!vis(e.b)) return;
    let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const want = (e.a.type==='hub'&&e.b.type==='hub') ? 190 : 95;
    const f = (d-want)*0.02*alpha;
    dx/=d; dy/=d;
    e.a.vx+=dx*f; e.a.vy+=dy*f; e.b.vx-=dx*f; e.b.vy-=dy*f;
  });
  vn.forEach(n => {
    n.vx -= n.x*0.0016*alpha; n.vy -= n.y*0.0016*alpha;  // 중심 인력
    if (n !== dragN){ n.x += n.vx; n.y += n.vy; }
    n.vx *= 0.86; n.vy *= 0.86;
  });
}

// ── 뷰(줌·팬) ──
let scale = 1, ox = 0, oy = 0;
function resize(){
  cv.width = gv.clientWidth * devicePixelRatio;
  cv.height = gv.clientHeight * devicePixelRatio;
  cv.style.width = gv.clientWidth+'px'; cv.style.height = gv.clientHeight+'px';
}
window.addEventListener('resize', () => {resize(); alpha=Math.max(alpha,.1);});
resize();
const toWorld = (px,py) => [ (px - gv.clientWidth/2 - ox)/scale, (py - gv.clientHeight/2 - oy)/scale ];

// ── 렌더 ──
let hoverN = null, selN = null, query = '';
function match(n){
  if (!query) return false;
  const s = (n.label+' '+(n.title||'')+' '+n.id).toLowerCase();
  return s.includes(query);
}
function draw(){
  tick();
  ctx.save();
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0,0,gv.clientWidth,gv.clientHeight);
  ctx.translate(gv.clientWidth/2 + ox, gv.clientHeight/2 + oy);
  ctx.scale(scale, scale);
  const dim = query || selN;
  // 간선
  edges.forEach(e => {
    if(!vis(e.a)||!vis(e.b)) return;
    const hot = (selN && (e.a===selN||e.b===selN)) || (hoverN && (e.a===hoverN||e.b===hoverN));
    ctx.strokeStyle = hot ? 'rgba(180,195,215,.55)' : 'rgba(120,132,150,.16)';
    ctx.lineWidth = (hot?1.4:0.8)/scale;
    ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y); ctx.stroke();
  });
  // 노드
  nodes.forEach(n => {
    if(!vis(n)) return;
    const col = css(CATCOL[n.cat]);
    const hot = n===hoverN || n===selN || match(n);
    const neigh = selN && edges.some(e => (e.a===selN&&e.b===n)||(e.b===selN&&e.a===n));
    let al = 1;
    if (dim && !hot && !neigh && n!==selN) al = query ? 0.18 : 0.25;
    ctx.globalAlpha = al;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7);
    ctx.fillStyle = col; ctx.fill();
    if (n===selN){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.6/scale; ctx.stroke(); }
    // 라벨
    if (n.type==='hub' || scale>0.75 || hot){
      ctx.fillStyle = hot ? '#eef2f8' : 'rgba(200,208,222,.75)';
      ctx.font = (n.type==='hub' ? 'bold 12px' : '10px') + ' sans-serif';
      ctx.textAlign='center';
      ctx.fillText(n.label, n.x, n.y + n.r + 12);
    }
    ctx.globalAlpha = 1;
  });
  ctx.restore();
  requestAnimationFrame(draw);
}

// ── 인터랙션 ──
let dragN=null, panning=false, px0=0, py0=0;
function pick(px,py){
  const [wx,wy]=toWorld(px,py);
  let best=null, bd=1e9;
  nodes.forEach(n => {
    if(!vis(n)) return;
    const d=Math.hypot(n.x-wx,n.y-wy);
    if(d<Math.max(n.r+4, 9) && d<bd){best=n;bd=d;}
  });
  return best;
}
cv.addEventListener('mousedown', e => {
  const n=pick(e.offsetX,e.offsetY);
  if(n){dragN=n;} else {panning=true;}
  px0=e.offsetX; py0=e.offsetY; cv.classList.add('drag');
});
cv.addEventListener('mousemove', e => {
  if(dragN){
    const [wx,wy]=toWorld(e.offsetX,e.offsetY);
    dragN.x=wx; dragN.y=wy; alpha=Math.max(alpha,.06);
  } else if(panning){
    ox+=e.offsetX-px0; oy+=e.offsetY-py0; px0=e.offsetX; py0=e.offsetY;
  } else {
    hoverN=pick(e.offsetX,e.offsetY);
    cv.style.cursor = hoverN?'pointer':'grab';
  }
});
window.addEventListener('mouseup', e => {
  if(dragN && Math.hypot(e.offsetX-px0,e.offsetY-py0)<5) select(dragN);
  dragN=null; panning=false; cv.classList.remove('drag');
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY<0 ? 1.12 : 1/1.12;
  scale = Math.min(4, Math.max(.25, scale*k));
}, {passive:false});

// ── 사이드패널 (카드 md → 간이 렌더) ──
const side=document.getElementById('side'), sbody=document.getElementById('sbody');
document.getElementById('sclose').onclick = () => {side.classList.remove('open'); selN=null;};
function mdRender(md){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let out=[], inUl=false;
  for (let line of md.split('\n')){
    let h = line.match(/^(#{1,2}) (.*)/);
    if (h){ if(inUl){out.push('</ul>');inUl=false;}
      out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^- /.test(line)){ if(!inUl){out.push('<ul>');inUl=true;}
      out.push('<li>'+inline(line.slice(2))+'</li>'); continue; }
    if(inUl){out.push('</ul>');inUl=false;}
    if(line.trim()) out.push('<p>'+inline(line)+'</p>');
  }
  if(inUl) out.push('</ul>');
  return out.join('\n');
  function inline(s){
    s = esc(s);
    s = s.replace(/\[\[([a-z0-9_]+)\|([^\]]+)\]\]/g, '<span class="ilink" data-k="$1">$2</span>');
    s = s.replace(/\[\[([a-z0-9_]+)\]\]/g, '<span class="ilink" data-k="$1">$1</span>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank">$1</a>');
    return s;
  }
}
function select(n){
  selN=n; side.classList.add('open');
  const md = n.card || `# ${n.label}\n\n${n.desc||''}\n\n(프로젝트 개념 허브 — 연결된 논문을 클릭해 보세요)`;
  sbody.innerHTML = mdRender(md);
  sbody.querySelectorAll('.ilink').forEach(el => el.onclick = () => {
    const t = byId[el.dataset.k]; if(t) select(t);
  });
}

// ── 검색·범례 ──
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
});
const leg=document.getElementById('legend');
const CATNAME = {0:'개념 허브', ...G.cats};
Object.keys(CATNAME).forEach(c => {
  const d=document.createElement('div');
  d.innerHTML = `<i style="background:${css(CATCOL[c])}"></i>${CATNAME[c]}`;
  d.onclick = () => {
    const ci=+c;
    hidden.has(ci) ? hidden.delete(ci) : hidden.add(ci);
    d.classList.toggle('off'); alpha=Math.max(alpha,.2);
  };
  leg.appendChild(d);
});

draw();
</script></body></html>
